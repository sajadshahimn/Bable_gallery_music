<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pair · Babel Gallery</title>
<meta name="description" content="One address, two forms: the tune and the picture it encodes.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ebebea;--surface:#efeeed;--track:#dcdcdb;--fg:#17181a;--muted:#62656c;--accent:#2f6fe0;--btn:#9c9ea6;--btn-fg:#14151a;
--sh-d:rgba(150,150,158,.5);--sh-l:rgba(255,255,255,.95);--line:rgba(20,24,32,.1);
--raised:8px 8px 18px var(--sh-d),-8px -8px 18px var(--sh-l);--raised-sm:4px 4px 9px var(--sh-d),-4px -4px 9px var(--sh-l);--inset:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--line:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--line:rgba(255,255,255,.1)}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--accent)}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.back{color:var(--muted);text-decoration:none;font-size:14px;flex-shrink:0}
.back:hover{color:var(--fg)}
.addr-row{display:flex;gap:6px;flex:1;min-width:220px}
.addr-row input{flex:1;min-width:0;padding:9px 14px;border:0;border-radius:12px;background:var(--bg);box-shadow:var(--inset);color:var(--fg);font:13px ui-monospace,Menlo,Consolas,monospace}
.addr-row input:focus{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;background:var(--surface);color:var(--fg);padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;box-shadow:var(--raised-sm);transition:box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.btn:hover{box-shadow:6px 6px 13px var(--sh-d),-6px -6px 13px var(--sh-l)}
.btn:active{box-shadow:var(--inset);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.primary{background:var(--btn);color:var(--btn-fg);font-weight:600}
.btn.small{padding:6px 10px;font-size:12.5px}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn.ghost:hover{box-shadow:none;border-color:var(--accent);color:var(--accent)}
.panes{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0;overflow:hidden}
.pane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.pane-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);min-height:44px}
.pane-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pane-actions{display:flex;gap:6px;align-items:center}
.frame-wrap{flex:1;position:relative;min-height:0;background:var(--bg)}
.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:var(--bg);z-index:2;pointer-events:none}
.hintbar{flex:0 0 auto;padding:8px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.hintbar kbd{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--bg);box-shadow:var(--raised-sm);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--fg)}
@media (max-width:820px){
  .topbar{padding:10px 12px;gap:8px}
  .addr-row{order:2;width:100%;flex-basis:100%}
  .panes{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .pane{border-right:0;border-bottom:1px solid var(--line)}
  .pane:last-child{border-bottom:0}
  .hintbar{font-size:11px;gap:10px;padding:6px 10px}
  .hintbar span:nth-child(3){display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="back">← Gallery</a>
  <div class="addr-row">
    <input id="addr" type="text" placeholder="Paste an address…" autocomplete="off" spellcheck="false" aria-label="Address">
    <button class="btn primary" id="go" type="button">Go</button>
    <button class="btn" id="prev" type="button" title="Previous (←)" aria-label="Previous">‹</button>
    <button class="btn" id="next" type="button" title="Next (→)" aria-label="Next">›</button>
    <button class="btn" id="rand" type="button" title="Random (R)" aria-label="Random">🎲</button>
    <button class="btn" id="copy" type="button" title="Copy address (C)">Copy</button>
  </div>
</header>

<main class="panes">
  <div class="pane">
    <div class="pane-bar">
      <span class="pane-label">🎵 Music</span>
      <div class="pane-actions">
        <button class="btn small" id="play" type="button" disabled>▶ Play</button>
        <a class="btn small ghost" id="openMusic" href="#" target="_blank" rel="noopener" title="Open in full music page">Full ↗</a>
      </div>
    </div>
    <div class="frame-wrap">
      <iframe id="fr-music" allow="autoplay" title="Music"></iframe>
      <div class="loading" id="loadMusic">Loading music…</div>
    </div>
  </div>
  <div class="pane">
    <div class="pane-bar">
      <span class="pane-label">🖼 Image</span>
      <div class="pane-actions">
        <a class="btn small ghost" id="openImage" href="#" target="_blank" rel="noopener" title="Open in full image page">Full ↗</a>
      </div>
    </div>
    <div class="frame-wrap">
      <iframe id="fr-image" title="Image"></iframe>
      <div class="loading" id="loadImage">Loading image…</div>
    </div>
  </div>
</main>

<footer class="hintbar">
  <span><kbd>Space</kbd> play / pause</span>
  <span><kbd>R</kbd> random</span>
  <span><kbd>←</kbd> <kbd>→</kbd> prev / next</span>
  <span><kbd>C</kbd> copy address</span>
</footer>

<script>
(function(){
"use strict";

var input = document.getElementById('addr');
var frM = document.getElementById('fr-music');
var frI = document.getElementById('fr-image');
var goBtn = document.getElementById('go');
var prevBtn = document.getElementById('prev');
var nextBtn = document.getElementById('next');
var randBtn = document.getElementById('rand');
var copyBtn = document.getElementById('copy');
var playBtn = document.getElementById('play');
var openMusic = document.getElementById('openMusic');
var openImage = document.getElementById('openImage');
var loadM = document.getElementById('loadMusic');
var loadI = document.getElementById('loadImage');

var B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
var currentAddr = '';
var playing = false;

function randomAddress(){
  var buf = new Uint8Array(32);
  try { (window.crypto || window.msCrypto).getRandomValues(buf); }
  catch(e) { for (var i=0; i<32; i++) buf[i] = Math.floor(Math.random()*256); }
  var s = '';
  for (var j=0; j<32; j++) s += B62[buf[j] % 62];
  return s;
}

function setAddress(addr, updateHash){
  addr = String(addr || '').trim().replace(/[^0-9A-Za-z]/g, '');
  if (!addr) return;
  currentAddr = addr;
  input.value = addr;

  var enc = 'a=' + encodeURIComponent(addr);

  loadM.style.display = 'flex';
  frM.src = 'music.html#' + enc + '&embed=1';
  openMusic.href = 'music.html#' + enc;

  loadI.style.display = 'flex';
  frI.src = 'image.html#' + enc;
  openImage.href = 'image.html#' + enc;

  if (updateHash !== false) {
    try { history.replaceState(null, '', '#' + enc); } catch(e){}
  }

  playing = false;
  playBtn.textContent = '▶ Play';
  playBtn.disabled = true;
}

function currentAddressFromHash(){
  try {
    return new URLSearchParams(location.hash.slice(1)).get('a') || '';
  } catch(e) { return ''; }
}

function addOne(addr, delta){
  if (!addr) return addr;
  var n = 0n;
  for (var i=0; i<addr.length; i++){
    var k = B62.indexOf(addr[i]);
    if (k < 0) return addr;
    n = n * 62n + BigInt(k);
  }
  n += BigInt(delta);
  if (n < 0n) n = 0n;
  if (n === 0n) return '0';
  var s = '';
  while (n > 0n){ s = B62[Number(n % 62n)] + s; n /= 62n; }
  return s;
}

frM.addEventListener('load', function(){
  loadM.style.display = 'none';
  playBtn.disabled = false;
});
frI.addEventListener('load', function(){
  loadI.style.display = 'none';
});

goBtn.addEventListener('click', function(){ setAddress(input.value); });
input.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); setAddress(input.value); }
});
randBtn.addEventListener('click', function(){ setAddress(randomAddress()); });
prevBtn.addEventListener('click', function(){ setAddress(addOne(currentAddr, -1)); });
nextBtn.addEventListener('click', function(){ setAddress(addOne(currentAddr, 1)); });

copyBtn.addEventListener('click', function(){
  if (!currentAddr) return;
  var done = function(){
    var t = copyBtn.textContent;
    copyBtn.textContent = 'Copied ✓';
    setTimeout(function(){ copyBtn.textContent = t; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(currentAddr).then(done, function(){});
  } else {
    input.select();
    try { document.execCommand('copy'); done(); } catch(e){}
  }
});

playBtn.addEventListener('click', function(){
  if (playBtn.disabled) return;
  try {
    if (playing){
      frM.contentWindow.postMessage({action:'stop'}, '*');
      playing = false;
      playBtn.textContent = '▶ Play';
    } else {
      frM.contentWindow.postMessage({action:'play'}, '*');
      playing = true;
      playBtn.textContent = '■ Stop';
    }
  } catch(e){
    playBtn.textContent = '⚠ Click play in frame';
    setTimeout(function(){ playBtn.textContent = playing ? '■ Stop' : '▶ Play'; }, 2500);
  }
});

document.addEventListener('keydown', function(e){
  var t = e.target && e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;

  if (e.code === 'Space' || e.key === ' '){
    e.preventDefault();
    playBtn.click();
  } else if (e.key === 'r' || e.key === 'R'){
    e.preventDefault();
    randBtn.click();
  } else if (e.key === 'c' || e.key === 'C'){
    e.preventDefault();
    copyBtn.click();
  } else if (e.key === 'ArrowLeft'){
    e.preventDefault();
    prevBtn.click();
  } else if (e.key === 'ArrowRight'){
    e.preventDefault();
    nextBtn.click();
  }
});

window.addEventListener('hashchange', function(){
  var a = currentAddressFromHash();
  if (a && a !== currentAddr) setAddress(a, false);
});

var initial = currentAddressFromHash();
if (!initial){
  initial = randomAddress();
  try { history.replaceState(null, '', '#a=' + initial); } catch(e){}
}
setAddress(initial, false);

})();
</script>
</body>
  </html>
