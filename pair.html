<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pair · Babel Gallery</title>
<meta name="description" content="One address, two forms: the tune and the picture it encodes.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ebebea;--surface:#efeeed;--track:#dcdcdb;--fg:#17181a;--muted:#62656c;--accent:#2f6fe0;--btn:#9c9ea6;--btn-fg:#14151a;
--sh-d:rgba(150,150,158,.5);--sh-l:rgba(255,255,255,.95);--line:rgba(20,24,32,.1);
--raised:8px 8px 18px var(--sh-d),-8px -8px 18px var(--sh-l);--raised-sm:4px 4px 9px var(--sh-d),-4px -4px 9px var(--sh-l);--inset:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--line:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--line:rgba(255,255,255,.1)}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:14px;padding:16px 18px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.top a{color:var(--muted);text-decoration:none;font-size:14px}
.top a:hover{color:var(--fg)}
.addr-wrap{flex:1;min-width:220px;display:flex;gap:8px;align-items:center}
.addr-wrap input{flex:1;padding:10px 14px;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--inset);color:var(--fg);font:13px ui-monospace,Menlo,Consolas,monospace}
.btn{border:0;border-radius:999px;background:var(--surface);color:var(--fg);padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;box-shadow:var(--raised-sm);transition:box-shadow .15s}
.btn:hover{box-shadow:6px 6px 13px var(--sh-d),-6px -6px 13px var(--sh-l)}
.btn:active{box-shadow:var(--inset);color:var(--accent);font-weight:600}
.btn.primary{background:var(--btn);color:var(--btn-fg);font-weight:600}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 68px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
@media (max-width:820px){.panes{grid-template-columns:1fr;height:auto}.pane{height:60vh!important;min-height:400px}}
.pane{position:relative;border:0;background:transparent;overflow:hidden}
.pane iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.pane-label{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;background:rgba(20,24,32,.7);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;z-index:2}
</style>
</head>
<body>

<div class="top">
  <a href="index.html">← Gallery</a>
  <div class="addr-wrap">
    <input id="addr" type="text" placeholder="Paste an address" autocomplete="off" spellcheck="false">
    <button class="btn primary" id="go" type="button">Go</button>
    <button class="btn" id="rand" type="button" title="Random address">🎲</button>
    <button class="btn" id="copy" type="button" title="Copy address">Copy</button>
  </div>
</div>

<div class="panes">
  <div class="pane">
    <span class="pane-label">Music</span>
    <iframe id="fr-music" title="Music" allow="autoplay"></iframe>
  </div>
  <div class="pane">
    <span class="pane-label">Image</span>
    <iframe id="fr-image" title="Image"></iframe>
  </div>
</div>

<script>
(function(){
  var input  = document.getElementById('addr');
  var frM    = document.getElementById('fr-music');
  var frI    = document.getElementById('fr-image');
  var goBtn  = document.getElementById('go');
  var randBtn= document.getElementById('rand');
  var copyBtn= document.getElementById('copy');

  var CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

  function randomAddress(){
    var s = '';
    var buf = new Uint8Array(40);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    for (var i=0; i<40; i++) s += CHARS[buf[i] % 62];
    return s;
  }

  function setAddress(addr, updateHash){
    addr = (addr || '').trim();
    if (!addr) return;
    input.value = addr;
    var enc = 'a=' + encodeURIComponent(addr);
    frM.src = 'music.html#' + enc + '&embed=1';
    frI.src = 'image.html#' + enc;
    if (updateHash !== false && location.hash.slice(1) !== enc) {
      history.replaceState(null, '', '#' + enc);
    }
  }

  function currentAddress(){
    var params = new URLSearchParams(location.hash.slice(1));
    return params.get('a') || '';
  }

  var initial = currentAddress();
  if (!initial) {
    initial = randomAddress();
    history.replaceState(null, '', '#a=' + initial);
  }
  setAddress(initial, false);

  goBtn.addEventListener('click', function(){ setAddress(input.value); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); setAddress(input.value); }
  });
  randBtn.addEventListener('click', function(){ setAddress(randomAddress()); });
  copyBtn.addEventListener('click', function(){
    var v = input.value;
    if (!v) return;
    var done = function(){
      var t = copyBtn.textContent;
      copyBtn.textContent = 'Copied ✓';
      setTimeout(function(){ copyBtn.textContent = t; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(done, function(){});
    } else {
      input.select();
      try { document.execCommand('copy'); done(); } catch(e){}
    }
  });
  window.addEventListener('hashchange', function(){
    var a = currentAddress();
    if (a && a !== input.value) setAddress(a, false);
  });
})();
</script>
</body>
</html>
