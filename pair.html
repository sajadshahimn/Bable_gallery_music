<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multi · Babel Gallery</title>
<meta name="description" content="Multiple galleries side by side, all sharing one address.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ebebea;--surface:#efeeed;--track:#dcdcdb;--fg:#17181a;--muted:#62656c;--accent:#2f6fe0;--btn:#9c9ea6;--btn-fg:#14151a;
--sh-d:rgba(150,150,158,.5);--sh-l:rgba(255,255,255,.95);--line:rgba(20,24,32,.1);
--raised:8px 8px 18px var(--sh-d),-8px -8px 18px var(--sh-l);--raised-sm:4px 4px 9px var(--sh-d),-4px -4px 9px var(--sh-l);--inset:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--line:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--line:rgba(255,255,255,.1)}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--accent)}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.back{color:var(--muted);text-decoration:none;font-size:14px;flex-shrink:0}
.back:hover{color:var(--fg)}
.addr-row{display:flex;gap:6px;flex:1;min-width:200px}
.addr-row input{flex:1;min-width:0;padding:8px 12px;border:0;border-radius:10px;background:var(--bg);box-shadow:var(--inset);color:var(--fg);font:12px ui-monospace,Menlo,Consolas,monospace}
.addr-row input:focus{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;background:var(--surface);color:var(--fg);padding:8px 13px;font:inherit;font-size:13px;cursor:pointer;box-shadow:var(--raised-sm);transition:box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.btn:hover{box-shadow:6px 6px 13px var(--sh-d),-6px -6px 13px var(--sh-l)}
.btn:active{box-shadow:var(--inset);color:var(--accent)}
.btn.primary{background:var(--btn);color:var(--btn-fg);font-weight:600}
.btn.small{padding:6px 10px;font-size:12px}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn.ghost:hover{box-shadow:none;border-color:var(--accent);color:var(--accent)}

/* Selector */
.selector{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto}
.sel-chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;user-select:none;display:inline-flex;align-items:center;gap:5px;box-shadow:var(--raised-sm)}
.sel-chip:hover{border-color:var(--accent);color:var(--fg)}
.sel-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--inset)}
.sel-chip input{display:none}

/* Panes */
.panes{flex:1;display:grid;gap:1px;background:var(--line);min-height:0;overflow:hidden;padding:1px}
.panes[data-count="1"]{grid-template-columns:1fr}
.panes[data-count="2"]{grid-template-columns:1fr 1fr}
.panes[data-count="3"]{grid-template-columns:1fr 1fr 1fr}
.panes[data-count="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.panes[data-count="5"]{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.panes[data-count="6"]{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--bg);position:relative}
.pane-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line);min-height:36px;gap:8px}
.pane-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.pane-actions{display:flex;gap:4px;align-items:center}
.frame-wrap{flex:1;position:relative;min-height:120px;background:var(--bg);overflow:hidden}
.frame-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:var(--bg);z-index:2;pointer-events:none}

.hintbar{flex:0 0 auto;padding:6px 14px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.hintbar kbd{display:inline-block;padding:1px 5px;border-radius:3px;background:var(--bg);box-shadow:var(--raised-sm);font-family:ui-monospace,monospace;font-size:10px;color:var(--fg)}

@media (max-width:820px){
  .topbar{padding:8px 10px;gap:6px}
  .addr-row{order:2;width:100%;flex-basis:100%}
  .selector{padding:8px 10px}
  .panes[data-count="2"],.panes[data-count="3"],.panes[data-count="4"],.panes[data-count="5"],.panes[data-count="6"]{
    grid-template-columns:1fr;
    grid-template-rows:repeat(var(--rows,2),minmax(220px,1fr));
  }
  .panes[data-count="2"]{--rows:2}
  .panes[data-count="3"]{--rows:3}
  .panes[data-count="4"]{--rows:4}
  .panes[data-count="5"]{--rows:5}
  .panes[data-count="6"]{--rows:6}
  .hintbar{font-size:10.5px;gap:10px;padding:5px 8px}
  .hintbar span:nth-child(3){display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="back">← Home</a>
  <div class="addr-row">
    <input id="addr" type="text" placeholder="Address…" autocomplete="off" spellcheck="false" aria-label="Address">
    <button class="btn primary" id="go" type="button">Go</button>
    <button class="btn" id="prev" type="button" title="Previous (←)" aria-label="Previous">‹</button>
    <button class="btn" id="next" type="button" title="Next (→)" aria-label="Next">›</button>
    <button class="btn" id="rand" type="button" title="Random (R)" aria-label="Random">🎲</button>
    <button class="btn" id="copy" type="button" title="Copy (C)">Copy</button>
  </div>
</header>

<div class="selector" id="selector">
  <label class="sel-chip on" data-g="music"><input type="checkbox" checked>🎵 Music</label>
  <label class="sel-chip on" data-g="image"><input type="checkbox" checked>🖼 Images</label>
  <label class="sel-chip" data-g="code"><input type="checkbox">💻 Code</label>
  <label class="sel-chip" data-g="ecosystem"><input type="checkbox">🌱 Ecosystem</label>
  <label class="sel-chip" data-g="aquarium"><input type="checkbox">🐠 Aquarium</label>
  <label class="sel-chip" data-g="galaxy"><input type="checkbox">🌌 Galaxy</label>
</div>

<main class="panes" id="panes" data-count="2"></main>

<footer class="hintbar">
  <span><kbd>Space</kbd> play / pause (music)</span>
  <span><kbd>R</kbd> random</span>
  <span><kbd>←</kbd> <kbd>→</kbd> prev / next</span>
  <span><kbd>C</kbd> copy address</span>
</footer>

<script>
(function(){
"use strict";

var GALLERIES = {
  music:     { name: 'Music',     icon: '🎵', url: 'music.html',     sound: true },
  image:     { name: 'Images',    icon: '🖼', url: 'image.html' },
  code:      { name: 'Code',      icon: '💻', url: 'code.html' },
  ecosystem: { name: 'Ecosystem', icon: '🌱', url: 'ecosystem.html' },
  aquarium:  { name: 'Aquarium',  icon: '🐠', url: 'aquarium.html' },
  galaxy:    { name: 'Galaxy',    icon: '🌌', url: 'galaxy.html' }
};

var B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
var currentAddr = '';
var active = ['music', 'image'];
var playingMusic = false;

var $ = function(id){ return document.getElementById(id); };
var panes = $('panes');

function randomAddress(){
  var buf = new Uint8Array(24);
  try { (window.crypto || window.msCrypto).getRandomValues(buf); }
  catch(e) { for (var i=0; i<24; i++) buf[i] = Math.floor(Math.random()*256); }
  var s = '';
  for (var j=0; j<24; j++) s += B62[buf[j] % 62];
  return s;
}

function buildPanes(){
  var panes_ = $('panes');
  var existing = {};
  panes_.querySelectorAll('.pane').forEach(function(p){
    existing[p.dataset.g] = p;
  });

  panes_.innerHTML = '';
  panes_.setAttribute('data-count', active.length);

  active.forEach(function(g){
    var meta = GALLERIES[g];
    var pane = document.createElement('div');
    pane.className = 'pane';
    pane.dataset.g = g;

    var bar = document.createElement('div');
    bar.className = 'pane-bar';

    var lbl = document.createElement('span');
    lbl.className = 'pane-label';
    lbl.textContent = meta.icon + ' ' + meta.name;
    bar.appendChild(lbl);

    var actions = document.createElement('div');
    actions.className = 'pane-actions';

    if (meta.sound){
      var playBtn = document.createElement('button');
      playBtn.className = 'btn small';
      playBtn.id = 'play-' + g;
      playBtn.type = 'button';
      playBtn.textContent = playingMusic ? '■ Stop' : '▶ Play';
      playBtn.addEventListener('click', function(){ toggleSound(g); });
      actions.appendChild(playBtn);
    }

    var openBtn = document.createElement('a');
    openBtn.className = 'btn small ghost';
    openBtn.textContent = 'Full ↗';
    openBtn.href = meta.url + '#' + encodeAddr();
    openBtn.target = '_blank';
    openBtn.rel = 'noopener';
    actions.appendChild(openBtn);

    bar.appendChild(actions);
    pane.appendChild(bar);

    var wrap = document.createElement('div');
    wrap.className = 'frame-wrap';

    var loading = document.createElement('div');
    loading.className = 'loading';
    loading.textContent = 'Loading…';
    loading.style.display = 'flex';

    var iframe = document.createElement('iframe');
    iframe.title = meta.name;
    if (meta.sound) iframe.setAttribute('allow', 'autoplay');
    iframe.dataset.g = g;
    iframe.addEventListener('load', function(){
      loading.style.display = 'none';
    });

    wrap.appendChild(iframe);
    wrap.appendChild(loading);
    pane.appendChild(wrap);
    panes_.appendChild(pane);

    if (currentAddr){
      setIframeSrc(iframe, g, currentAddr);
      setTimeout(function(){ loading.style.display = 'none'; }, 4000);
    }
  });
}

function encodeAddr(){
  return 'a=' + encodeURIComponent(currentAddr);
}

function setIframeSrc(iframe, g, addr){
  var meta = GALLERIES[g];
  if (g === 'music'){
    iframe.src = meta.url + '#' + encodeAddr() + '&embed=1';
  } else {
    iframe.src = meta.url + '#' + encodeAddr();
  }
}

function broadcastAddress(addr){
  currentAddr = addr;
  $('addr').value = addr;
  try { history.replaceState(null, '', '#' + encodeAddr()); } catch(e){}

  panes.querySelectorAll('iframe').forEach(function(iframe){
    setIframeSrc(iframe, iframe.dataset.g, addr);
  });

  panes.querySelectorAll('.pane-actions a').forEach(function(a){
    var g = a.closest('.pane').dataset.g;
    a.href = GALLERIES[g].url + '#' + encodeAddr();
  });

  playingMusic = false;
  var playBtn = $('play-music');
  if (playBtn) playBtn.textContent = '▶ Play';
}

function toggleSound(g){
  var iframe = panes.querySelector('iframe[data-g="' + g + '"]');
  if (!iframe) return;
  var btn = $('play-' + g);
  if (!btn) return;
  try {
    if (playingMusic){
      iframe.contentWindow.postMessage({action:'stop'}, '*');
      playingMusic = false;
      btn.textContent = '▶ Play';
    } else {
      iframe.contentWindow.postMessage({action:'play'}, '*');
      playingMusic = true;
      btn.textContent = '■ Stop';
    }
  } catch(e){}
}

function toggleGallery(g){
  var idx = active.indexOf(g);
  if (idx >= 0){
    if (active.length <= 1) return;
    active.splice(idx, 1);
  } else {
    active.push(g);
  }
  buildPanes();
  if (currentAddr) broadcastAddress(currentAddr);
}

$('selector').addEventListener('click', function(e){
  var chip = e.target.closest('.sel-chip');
  if (!chip) return;
  e.preventDefault();
  var g = chip.dataset.g;
  toggleGallery(g);
  chip.classList.toggle('on', active.indexOf(g) >= 0);
});

$('go').addEventListener('click', function(){
  var a = $('addr').value.trim().replace(/[^0-9A-Za-z]/g, '');
  if (a) broadcastAddress(a);
});
$('addr').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); $('go').click(); }
});
$('prev').addEventListener('click', function(){
  if (!currentAddr) return;
  var n = 0n;
  for (var i = 0; i < currentAddr.length; i++){
    var k = B62.indexOf(currentAddr[i]);
    if (k < 0) return;
    n = n * 62n + BigInt(k);
  }
  n = n - 1n;
  if (n < 0n) n = 0n;
  broadcastAddress(n === 0n ? '0' : toB62(n));
});
$('next').addEventListener('click', function(){
  if (!currentAddr) return;
  var n = 0n;
  for (var i = 0; i < currentAddr.length; i++){
    var k = B62.indexOf(currentAddr[i]);
    if (k < 0) return;
    n = n * 62n + BigInt(k);
  }
  n += 1n;
  broadcastAddress(toB62(n));
});
$('rand').addEventListener('click', function(){
  broadcastAddress(randomAddress());
});
$('copy').addEventListener('click', function(){
  if (!currentAddr) return;
  var b = this;
  navigator.clipboard.writeText(currentAddr).then(function(){
    var t = b.textContent;
    b.textContent = 'Copied ✓';
    setTimeout(function(){ b.textContent = t; }, 1200);
  });
});

function toB62(n){
  if (n === 0n) return '0';
  var s = '';
  while (n > 0n){ s = B62[Number(n % 62n)] + s; n /= 62n; }
  return s;
}

document.addEventListener('keydown', function(e){
  var tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.code === 'Space' || e.key === ' '){
    if (active.indexOf('music') >= 0){ e.preventDefault(); toggleSound('music'); }
  } else if (e.key === 'r' || e.key === 'R'){ e.preventDefault(); $('rand').click(); }
  else if (e.key === 'c' || e.key === 'C'){ e.preventDefault(); $('copy').click(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); $('prev').click(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); $('next').click(); }
});

function currentAddrFromHash(){
  try {
    return new URLSearchParams(location.hash.slice(1)).get('a') || '';
  } catch(e){ return ''; }
}

window.addEventListener('hashchange', function(){
  var a = currentAddrFromHash();
  if (a && a !== currentAddr) broadcastAddress(a);
});

// Init
buildPanes();
var initial = currentAddrFromHash();
if (!initial) initial = randomAddress();
setTimeout(function(){ broadcastAddress(initial); }, 100);

})();
</script>
</body>
</html>
