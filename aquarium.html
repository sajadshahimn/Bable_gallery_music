--bg:#ebebea;--surface:#efeeed;--track:#dcdcdb;--fg:#17181a;--muted:#62656c;--accent:#2f6fe0;--btn:#9c9ea6;--btn-fg:#14151a;
--sh-d:rgba(150,150,158,.5);--sh-l:rgba(255,255,255,.95);--line:rgba(20,24,32,.1);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--line:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--line:rgba(255,255,255,.1)}

<main>

<p class="sub">Every possible aquarium. Fish, plants, bubbles, and light from a single address.</p>

<div class="card">
  <div class="address-bar">

</main>

<script>
(function(){
"use strict";

/* ============================================================
   PARAMETERS — 23 params, ~11-12 base-62 chars
   ============================================================ */
var PARAMS = [
  { name: 'waterColor', radix: 8 },
  { name: 'waterDepth', radix: 4 },
  { name: 'lightRays',  radix: 4 },
  { name: 'fishType',   radix: 6 },
  { name: 'fishCount',  radix: 8 },
  { name: 'fishSize',   radix: 5 },
  { name: 'fishColor',  radix: 16 },
  { name: 'fishPattern',radix: 6 },
  { name: 'fishEyes',   radix: 3 },
  { name: 'fishTail',   radix: 4 },
  { name: 'fishSpeed',  radix: 4 },
  { name: 'fishBias',   radix: 4 },
  { name: 'plantCount', radix: 6 },
  { name: 'plantType',  radix: 4 },
  { name: 'plantColor', radix: 8 },
  { name: 'plantHeight',radix: 4 },
  { name: 'sandColor',  radix: 6 },
  { name: 'rocksCount', radix: 4 },
  { name: 'bubbleDensity', radix: 5 },
  { name: 'bubbleSize', radix: 3 },
  { name: 'sparkles',   radix: 3 },
  { name: 'mood',       radix: 4 },
  { name: 'seed',       radix: 16777216 }
];

var TOTAL = PARAMS.reduce(function(a,p){ return a * BigInt(p.radix); }, 1n);

/* ============================================================
   LOOKUP TABLES
   ============================================================ */
var WATER_NAMES = ['Clear','Blue','Teal','Purple','Pink','Night','Sunset','Dark'];
var WATER_COLORS = [
  ['#a8e6ff','#4aa8d8'],
  ['#4a9eff','#003d80'],
  ['#7dd3c0','#0d5c50'],
  ['#c9a0ff','#4a1a80'],
  ['#ffb8d9','#8a1c4a'],
  ['#2a3a5c','#0a1020'],
  ['#ff9a56','#8a2a5c'],
  ['#3a3a4a','#0a0a10']
];
var DEPTH_NAMES = ['Shallow','Medium','Deep','Abyss'];
var DEPTH_MULT = [0.6, 1.0, 1.3, 1.6];

var FISH_TYPE_NAMES = ['Simple','Angular','Round','Long','Puffer','Jellyfish'];
var FISH_SIZE_NAMES = ['Tiny','Small','Medium','Large','Huge'];
var FISH_SIZE_MULT = [0.4, 0.7, 1.1, 1.7, 2.4];
var FISH_SPEED_NAMES = ['Slow','Medium','Fast','Chaotic'];
var FISH_SPEED_MULT = [0.4, 1.0, 1.8, 3.0];
var FISH_BIAS_NAMES = ['Top','Middle','Bottom','Mixed'];

var FISH_COLORS = [
  '#ff6b6b','#ffa94d','#ffd43b','#a9e34b',
  '#40c057','#20c997','#22b8cf','#4dabf7',
  '#5c7cfa','#845ef7','#be4bdb','#e64980',
  '#f06595','#ffffff','#adb5bd','#f8f9fa'
];

var PLANT_TYPE_NAMES = ['Seaweed','Coral','Kelp','Grass'];
var PLANT_COLORS = [
  '#2d5016','#3d7a1e','#5a9e2a','#87a030',
  '#a0522d','#d2691e','#8b008b','#b22222'
];
var PLANT_HEIGHT_NAMES = ['Short','Medium','Tall','Huge'];
var PLANT_HEIGHT_MULT = [0.4, 0.7, 1.0, 1.4];

var SAND_NAMES = ['Cream','Tan','Black','Pink','Gray','Dark'];
var SAND_COLORS = ['#f5e6d3','#d4b896','#2c2c2c','#e8b4b8','#808080','#1a1a1a'];

var MOOD_NAMES = ['Calm','Mysterious','Vibrant','Dark'];
var MOOD_TINT = [
  null,
  'rgba(20,40,80,0.25)',
  'rgba(255,200,100,0.10)',
  'rgba(0,0,0,0.35)'
];

/* ============================================================
   BASE-62
   ============================================================ */
var B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
function toB62(n){ if(n===0n) return '0'; var s=''; while(n>0n){ s=B62[Number(n%62n)]+s; n/=62n; } return s; }
function fromB62(s){ var n=0n; for(var i=0;i<s.length;i++){ var k=B62.indexOf(s[i]); if(k<0) return null; n=n*62n+BigInt(k); } return n; }

function decode(loc){
  var p = {}, r = loc;
  for (var i = 0; i < PARAMS.length; i++){
    p[PARAMS[i].name] = Number(r % BigInt(PARAMS[i].radix));
    r = r / BigInt(PARAMS[i].radix);
  }
  return p;
}

/* ============================================================
   PRNG (mulberry32)
   ============================================================ */
function mulberry32(seed){
  return function(){
    seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   CANVAS + STATE
   ============================================================ */
var canvas = document.getElementById('aquarium');
var ctx = canvas.getContext('2d');
var W = 800, H = 450;

var currentLoc = 0n;
var params = null;
var scene = null;
var paused = false;
var startTime = performance.now();
var lastFrame = startTime;

// Audio
var ac = null, master = null, ambientGain = null, ambientSource = null, soundOn = false;

/* ============================================================
   SCENE GENERATION
   ============================================================ */
function generateScene(p, rand){
  var s = { fish: [], plants: [], rocks: [], bubbles: [], sparkles: [], food: [] };

  // ---- FISH ----
  var count = p.fishCount + 1;
  var sizeMul = FISH_SIZE_MULT[p.fishSize];
  var speedMul = FISH_SPEED_MULT[p.fishSpeed];
  var color = FISH_COLORS[p.fishColor];

  var yRange;
  if (p.fishBias === 0) yRange = [60, 180];
  else if (p.fishBias === 1) yRange = [130, 300];
  else if (p.fishBias === 2) yRange = [260, 400];
  else yRange = [60, 400];

  for (var i = 0; i < count; i++){
    var dir = rand() > 0.5 ? 1 : -1;
    s.fish.push({
      x: 60 + rand() * (W - 120),
      y: yRange[0] + rand() * (yRange[1] - yRange[0]),
      vx: dir * speedMul * (30 + rand() * 40),
      vy: (rand() * 2 - 1) * speedMul * 8,
      size: sizeMul * (14 + rand() * 8),
      color: color,
      type: p.fishType,
      pattern: p.fishPattern,
      eyes: p.fishEyes,
      tail: p.fishTail,
      phase: rand() * Math.PI * 2,
      phase2: rand() * Math.PI * 2,
      targetX: null,
      targetY: null
    });
  }

  // ---- PLANTS ----
  var pCount = p.plantCount;
  var pColor = PLANT_COLORS[p.plantColor];
  var pHeightMul = PLANT_HEIGHT_MULT[p.plantHeight];
  for (var j = 0; j < pCount; j++){
    s.plants.push({
      x: 30 + rand() * (W - 60),
      height: (60 + rand() * 80) * pHeightMul,
      width: 3 + rand() * 4,
      color: pColor,
      type: p.plantType,
      phase: rand() * Math.PI * 2,
      segs: 5 + Math.floor(rand() * 4)
    });
  }

  // ---- ROCKS ----
  for (var k = 0; k < p.rocksCount; k++){
    s.rocks.push({
      x: 60 + rand() * (W - 120),
      width: 40 + rand() * 60,
      height: 20 + rand() * 40,
      color: SAND_COLORS[p.sandColor],
      darker: rand() > 0.5
    });
  }

  // ---- BUBBLES ----
  var bCounts = [0, 6, 20, 50, 100];
  var bTotal = bCounts[p.bubbleDensity];
  var bSizes = [2, 4, 7];
  for (var b = 0; b < bTotal; b++){
    s.bubbles.push({
      x: rand() * W,
      y: rand() * H,
      vy: -20 - rand() * 30,
      size: bSizes[p.bubbleSize] * (0.6 + rand() * 0.6),
      phase: rand() * Math.PI * 2,
      alpha: 0.3 + rand() * 0.4
    });
  }

  // ---- SPARKLES ----
  var sCounts = [0, 12, 30];
  for (var sp = 0; sp < sCounts[p.sparkles]; sp++){
    s.sparkles.push({
      x: rand() * W,
      y: rand() * H,
      phase: rand() * Math.PI * 2,
      size: 1 + rand() * 2
    });
  }

  return s;
}

/* ============================================================
   DRAWING
   ============================================================ */
function drawBackground(t){
  var waterPair = WATER_COLORS[params.waterColor];
  var depthMul = DEPTH_MULT[params.waterDepth];

  // Gradient
  var grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, waterPair[0]);
  grad.addColorStop(1, waterPair[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Depth darkening
  if (depthMul > 1){
    ctx.fillStyle = 'rgba(0,0,0,' + ((depthMul - 1) * 0.25) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // Light rays
  if (params.lightRays > 0){
    var intensity = [0, 0.06, 0.12, 0.20][params.lightRays];
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 7; i++){
      var x = W * (0.08 + i * 0.14) + Math.sin(t * 0.3 + i) * 20;
      var w = 30 + i * 15;
      var rayGrad = ctx.createLinearGradient(x, 0, x + w, H);
      rayGrad.addColorStop(0, 'rgba(255,255,255,' + intensity + ')');
      rayGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rayGrad;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + w, 0);
      ctx.lineTo(x + w + 100, H);
      ctx.lineTo(x + 100, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // Water surface
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (var sx = 0; sx <= W; sx += 20){
    ctx.lineTo(sx, 6 + Math.sin(sx * 0.02 + t * 1.5) * 4);
  }
  ctx.lineTo(W, 0);
  ctx.closePath();
  ctx.fill();
}

function drawSand(){
  var sandCol = SAND_COLORS[params.sandColor];
  var sandTop = H - 40;

  // Sand
  ctx.fillStyle = sandCol;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (var x = 0; x <= W; x += 15){
    var y = sandTop + Math.sin(x * 0.015) * 8 + Math.cos(x * 0.03) * 4;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // Subtle shadow line
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.beginPath();
  ctx.moveTo(0, sandTop + 2);
  for (var x2 = 0; x2 <= W; x2 += 15){
    var y2 = sandTop + Math.sin(x2 * 0.015) * 8 + Math.cos(x2 * 0.03) * 4 + 3;
    ctx.lineTo(x2, y2);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();
}

function drawRocks(back){
  scene.rocks.forEach(function(r, i){
    var isBack = i % 2 === 0;
    if (isBack !== back) return;
    var baseY = H - 40 + Math.sin(r.x * 0.015) * 8;
    ctx.fillStyle = r.darker ? shadeColor(r.color, -30) : r.color;
    ctx.globalAlpha = isBack ? 0.7 : 1;
    ctx.beginPath();
    ctx.moveTo(r.x - r.width / 2, baseY + 5);
    ctx.lineTo(r.x - r.width / 2 + 12, baseY - r.height * 0.65);
    ctx.lineTo(r.x - r.width * 0.15, baseY - r.height);
    ctx.lineTo(r.x + r.width * 0.2, baseY - r.height * 0.7);
    ctx.lineTo(r.x + r.width / 2 - 8, baseY - r.height * 0.3);
    ctx.lineTo(r.x + r.width / 2, baseY + 5);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function shadeColor(hex, amount){
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, Math.min(255, r + amount));
  g = Math.max(0, Math.min(255, g + amount));
  b = Math.max(0, Math.min(255, b + amount));
  return '#' + [r,g,b].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
}

function drawPlants(t){
  scene.plants.forEach(function(p){
    var baseY = H - 40 + Math.sin(p.x * 0.015) * 8;
    var segments = p.segs;
    var segH = p.height / segments;
    var x = p.x;
    var y = baseY;

    if (p.type === 0){ // Seaweed — swaying curve
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      var cx = x, cy = y;
      for (var i = 0; i < segments; i++){
        var sway = Math.sin(t * 1.2 + p.phase + i * 0.5) * 8;
        cx += sway;
        cy -= segH;
        ctx.lineTo(cx, cy);
      }
      ctx.stroke();
    } else if (p.type === 1){ // Coral — branching
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.width * 1.2;
      ctx.lineCap = 'round';
      drawCoral(x, y, p.height, t * 0.4 + p.phase, p.color, p.width);
    } else if (p.type === 2){ // Kelp — tall blades
      ctx.fillStyle = p.color;
      for (var j = 0; j < 3; j++){
        var off = (j - 1) * 5;
        var sway = Math.sin(t * 0.8 + p.phase + j) * 10;
        ctx.beginPath();
        ctx.moveTo(x + off, y);
        ctx.quadraticCurveTo(x + off + sway, y - p.height * 0.5, x + off + sway * 0.8, y - p.height);
        ctx.quadraticCurveTo(x + off + sway * 0.6 + 3, y - p.height * 0.5, x + off + 4, y);
        ctx.closePath();
        ctx.fill();
      }
    } else { // Grass — short blades
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.width * 0.6;
      ctx.lineCap = 'round';
      for (var k = 0; k < 5; k++){
        var gx = x + (k - 2) * 4;
        var gs = Math.sin(t * 1.5 + p.phase + k) * 4;
        ctx.beginPath();
        ctx.moveTo(gx, y);
        ctx.quadraticCurveTo(gx + gs, y - p.height * 0.5, gx + gs, y - p.height);
        ctx.stroke();
      }
    }
  });
}

function drawCoral(x, y, h, phase, color, w){
  var branch = function(bx, by, len, angle, depth){
    if (depth === 0 || len < 3) return;
    var ex = bx + Math.cos(angle) * len;
    var ey = by + Math.sin(angle) * len;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    var sway = Math.sin(phase + depth) * 0.1;
    branch(ex, ey, len * 0.7, angle - 0.4 + sway, depth - 1);
    branch(ex, ey, len * 0.7, angle + 0.4 + sway, depth - 1);
  };
  ctx.lineWidth = w;
  ctx.strokeStyle = color;
  branch(x, y, h * 0.4, -Math.PI / 2, 3);
}

function drawFish(f, t){
  var dir = f.vx >= 0 ? 1 : -1;
  var s = f.size;
  var sway = Math.sin(t * 3 + f.phase) * 0.15;

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(dir, 1);

  // Glow for glowing pattern
  if (f.pattern === 4){
    ctx.shadowBlur = s * 0.6;
    ctx.shadowColor = f.color;
  }

  // ---- TAIL ----
  ctx.save();
  ctx.translate(-s * 0.85, 0);
  ctx.rotate(sway);
  ctx.fillStyle = f.color;
  if (f.tail === 0){ // small
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-s * 0.4, -s * 0.25);
    ctx.lineTo(-s * 0.4, s * 0.25);
    ctx.closePath();
    ctx.fill();
  } else if (f.tail === 1){ // long
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-s * 0.8, -s * 0.35);
    ctx.lineTo(-s * 0.8, s * 0.35);
    ctx.closePath();
    ctx.fill();
  } else if (f.tail === 2){ // fork
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-s * 0.6, -s * 0.4);
    ctx.lineTo(-s * 0.35, 0);
    ctx.lineTo(-s * 0.6, s * 0.4);
    ctx.closePath();
    ctx.fill();
  } else { // frilly
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-s * 0.3, -s * 0.3, -s * 0.5, -s * 0.25);
    ctx.quadraticCurveTo(-s * 0.4, -s * 0.1, -s * 0.6, 0);
    ctx.quadraticCurveTo(-s * 0.4, s * 0.1, -s * 0.5, s * 0.25);
    ctx.quadraticCurveTo(-s * 0.3, s * 0.3, 0, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // ---- BODY ----
  ctx.fillStyle = f.color;
  if (f.type === 0){ // simple
    ctx.beginPath();
    ctx.ellipse(0, 0, s, s * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.type === 1){ // angular
    ctx.beginPath();
    ctx.moveTo(s * 0.95, 0);
    ctx.lineTo(s * 0.2, -s * 0.55);
    ctx.lineTo(-s * 0.8, 0);
    ctx.lineTo(s * 0.2, s * 0.55);
    ctx.closePath();
    ctx.fill();
  } else if (f.type === 2){ // round
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.type === 3){ // long
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 1.3, s * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.type === 4){ // puffer
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
    ctx.fill();
    // Spikes
    for (var i = 0; i < 12; i++){
      var a = (i / 12) * Math.PI * 2 + t * 0.3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * s * 0.65, Math.sin(a) * s * 0.65);
      ctx.lineTo(Math.cos(a) * s * 0.95, Math.sin(a) * s * 0.95);
      ctx.lineWidth = s * 0.05;
      ctx.strokeStyle = f.color;
      ctx.stroke();
    }
  } else { // jellyfish
    ctx.beginPath();
    ctx.arc(0, -s * 0.1, s * 0.55, Math.PI, 0);
    ctx.lineTo(-s * 0.55, s * 0.1);
    ctx.lineTo(s * 0.55, s * 0.1);
    ctx.closePath();
    ctx.fill();
    // Tentacles
    ctx.strokeStyle = f.color;
    ctx.lineWidth = s * 0.04;
    for (var j = 0; j < 6; j++){
      var tx = -s * 0.45 + j * s * 0.18;
      var wave = Math.sin(t * 2 + j * 0.8) * s * 0.15;
      ctx.beginPath();
      ctx.moveTo(tx, s * 0.1);
      ctx.quadraticCurveTo(tx + wave, s * 0.4, tx, s * 0.75);
      ctx.stroke();
    }
  }

  // ---- PATTERN ----
  if (f.pattern === 1){ // spots
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (var s1 = 0; s1 < 4; s1++){
      var px = -s * 0.5 + s1 * s * 0.35;
      var py = Math.sin(s1 * 1.5 + f.phase2) * s * 0.15;
      ctx.beginPath();
      ctx.arc(px, py, s * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (f.pattern === 2){ // stripes
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    for (var s2 = 0; s2 < 3; s2++){
      ctx.fillRect(-s * 0.5 + s2 * s * 0.35, -s * 0.5, s * 0.08, s);
    }
  } else if (f.pattern === 3){ // gradient highlight
    var g2 = ctx.createLinearGradient(0, -s, 0, s);
    g2.addColorStop(0, 'rgba(255,255,255,0.4)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.ellipse(0, -s * 0.15, s * 0.85, s * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.pattern === 5){ // dark eyes pattern (make it distinctive)
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(s * 0.2, 0, s * 0.15, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- EYES ----
  if (f.eyes > 0 && f.type !== 5){
    var eyeR = s * 0.13;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s * 0.45, -s * 0.12, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(s * 0.48, -s * 0.12, eyeR * 0.55, 0, Math.PI * 2);
    ctx.fill();

    if (f.eyes === 2){
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s * 0.45, s * 0.12, eyeR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(s * 0.48, s * 0.12, eyeR * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawBubbles(){
  scene.bubbles.forEach(function(b){
    ctx.strokeStyle = 'rgba(255,255,255,' + b.alpha + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x + Math.sin(b.phase) * 3, b.y, b.size, 0, Math.PI * 2);
    ctx.stroke();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,' + (b.alpha * 0.6) + ')';
    ctx.beginPath();
    ctx.arc(b.x + Math.sin(b.phase) * 3 - b.size * 0.3, b.y - b.size * 0.3, b.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawSparkles(t){
  scene.sparkles.forEach(function(s){
    var a = (Math.sin(t * 2 + s.phase) + 1) * 0.4;
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawFood(){
  scene.food.forEach(function(f){
    ctx.fillStyle = '#f5c542';
    ctx.beginPath();
    ctx.arc(f.x, f.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ============================================================
   UPDATE
   ============================================================ */
function updateScene(dt, t){
  // Fish movement
  scene.fish.forEach(function(f){
    // Food seeking
    if (f.targetX !== null && scene.food.length > 0){
      var nearest = null, nd = Infinity;
      scene.food.forEach(function(food){
        var d = Math.hypot(food.x - f.x, food.y - f.y);
        if (d < nd){ nd = d; nearest = food; }
      });
      if (nearest && nd < 300){
        var dx = nearest.x - f.x;
        var dy = nearest.y - f.y;
        var mag = Math.hypot(dx, dy) || 1;
        f.vx += (dx / mag) * 100 * dt;
        f.vy += (dy / mag) * 100 * dt;
        if (nd < 8){
          // Eat
          var idx = scene.food.indexOf(nearest);
          if (idx >= 0) scene.food.splice(idx, 1);
        }
      }
    }

    f.x += f.vx * dt;
    f.y += f.vy * dt;

    // Wall bounce
    if (f.x < 30){ f.x = 30; f.vx = Math.abs(f.vx); }
    if (f.x > W - 30){ f.x = W - 30; f.vx = -Math.abs(f.vx); }
    if (f.y < 50){ f.y = 50; f.vy = Math.abs(f.vy); }
    if (f.y > H - 60){ f.y = H - 60; f.vy = -Math.abs(f.vy); }

    // Gentle wander
    f.vy += (Math.sin(t * 0.7 + f.phase) * 15 - f.vy * 0.5) * dt;
  });

  // Food falls
  scene.food.forEach(function(f){
    f.y += 15 * dt;
    f.life -= dt;
  });
  scene.food = scene.food.filter(function(f){ return f.life > 0 && f.y < H - 40; });

  // Bubbles rise
  scene.bubbles.forEach(function(b){
    b.y += b.vy * dt;
    b.phase += dt * 2;
    if (b.y < -10){
      b.y = H + 10;
      b.x = Math.random() * W;
    }
  });

  // Sparkles twinkle
  scene.sparkles.forEach(function(s){
    // No movement needed
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function render(t){
  ctx.clearRect(0, 0, W, H);

  drawBackground(t);
  drawRocks(true);   // back rocks
  drawPlants(t);

  // Food particles
  drawFood();

  // Fish
  scene.fish.forEach(function(f){ drawFish(f, t); });

  // Bubbles
  drawBubbles();

  // Front rocks
  drawRocks(false);

  // Sand
  drawSand();

  // Sparkles
  drawSparkles(t);

  // Mood tint
  var tint = MOOD_TINT[params.mood];
  if (tint){
    ctx.fillStyle = tint;
    ctx.fillRect(0, 0, W, H);
  }

  // Vignette
  var vig = ctx.createRadialGradient(W/2, H/2, H * 0.4, W/2, H/2, H * 0.9);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
function frame(now){
  requestAnimationFrame(frame);
  if (paused) return;
  if (document.hidden) return;

  var dt = Math.min(0.05, (now - lastFrame) / 1000);
  var t = (now - startTime) / 1000;
  lastFrame = now;

  updateScene(dt, t);
  render(t);
}

/* ============================================================
   AUDIO
   ============================================================ */
function initAudio(){
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = 0.3;
    master.connect(ac.destination);

    // Ambient underwater drone
    var bufSize = 3 * ac.sampleRate;
    var noiseBuf = ac.createBuffer(1, bufSize, ac.sampleRate);
    var data = noiseBuf.getChannelData(0);
    for (var i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    ambientSource = ac.createBufferSource();
    ambientSource.buffer = noiseBuf;
    ambientSource.loop = true;

    var lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 250;
    lp.Q.value = 0.8;

    ambientGain = ac.createGain();
    ambientGain.gain.value = 0;

    ambientSource.connect(lp);
    lp.connect(ambientGain);
    ambientGain.connect(master);
    ambientSource.start();
  } catch(e){}
}

function playBubbleSound(){
  if (!soundOn || !ac) return;
  var t = ac.currentTime;
  var osc = ac.createOscillator();
  var g = ac.createGain();
  var freq = 400 + Math.random() * 600;
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(freq * 1.6, t + 0.06);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.06, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  osc.connect(g);
  g.connect(master);
  osc.start(t);
  osc.stop(t + 0.15);
}

function toggleSound(){
  initAudio();
  soundOn = !soundOn;
  if (!ac) return;
  if (ac.state === 'suspended') ac.resume();
  if (soundOn){
    ambientGain.gain.linearRampToValueAtTime(0.15, ac.currentTime + 0.5);
  } else {
    ambientGain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.3);
  }
  var btn = document.getElementById('sound-btn');
  btn.textContent = soundOn ? '🔊' : '🔇';
  btn.classList.toggle('on', soundOn);
}

/* ============================================================
   RENDER FROM ADDRESS
   ============================================================ */
function renderLoc(loc){
  currentLoc = loc;
  params = decode(loc);
  var rand = mulberry32(params.seed);
  scene = generateScene(params, rand);
  startTime = performance.now();
  lastFrame = startTime;

  document.getElementById('addr').value = toB62(loc);
  try { history.replaceState(null, '', '#a=' + toB62(loc)); } catch(e){}

  // Update meta
  document.getElementById('m-water').textContent = WATER_NAMES[params.waterColor] + ' · ' + DEPTH_NAMES[params.waterDepth];
  document.getElementById('m-fish').textContent = (params.fishCount + 1) + ' × ' + FISH_TYPE_NAMES[params.fishType] + ' (' + FISH_SIZE_NAMES[params.fishSize] + ')';
  document.getElementById('m-plants').textContent = params.plantCount + ' × ' + PLANT_TYPE_NAMES[params.plantType];
  document.getElementById('m-mood').textContent = MOOD_NAMES[params.mood];

  render(0);
}

function randomLoc(){
  var buf = new Uint8Array(16);
  try { crypto.getRandomValues(buf); } catch(e){ for (var i=0;i<16;i++) buf[i] = Math.floor(Math.random()*256); }
  var x = 0n;
  for (var j = 0; j < 16; j++) x = (x << 8n) | BigInt(buf[j]);
  return x % TOTAL;
}

/* ============================================================
   EXPORT PNG
   ============================================================ */
function downloadPNG(){
  var addr = toB62(currentLoc).slice(0, 12);
  canvas.toBlob(function(blob){
    if (!blob) return;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'aquarium-' + addr + '.png';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  }, 'image/png');
}

/* ============================================================
   UI EVENTS
   ============================================================ */
var $ = function(id){ return document.getElementById(id); };

$('go').addEventListener('click', function(){
  var n = fromB62($('addr').value.trim());
  if (n !== null) renderLoc(n % TOTAL);
});
$('addr').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); $('go').click(); }
});
$('prev').addEventListener('click', function(){ renderLoc((currentLoc - 1n + TOTAL) % TOTAL); });
$('next').addEventListener('click', function(){ renderLoc((currentLoc + 1n) % TOTAL); });
$('rand').addEventListener('click', function(){ renderLoc(randomLoc()); });
$('copy').addEventListener('click', function(){
  var b = this;
  navigator.clipboard.writeText(toB62(currentLoc)).then(function(){
    var t = b.textContent;
    b.textContent = 'Copied ✓';
    setTimeout(function(){ b.textContent = t; }, 1200);
  });
});
$('png').addEventListener('click', downloadPNG);
$('reset').addEventListener('click', function(){
  var rand = mulberry32(params.seed + 1);
  scene = generateScene(params, rand);
  startTime = performance.now();
});
$('feed').addEventListener('click', function(){
  for (var i = 0; i < 5; i++){
    scene.food.push({
      x: W/2 + (Math.random() - 0.5) * 200,
      y: 40 + Math.random() * 60,
      life: 8
    });
  }
  $('status').textContent = 'Food dropped!';
  setTimeout(function(){ $('status').textContent = 'Click the aquarium to feed the fish.'; }, 3000);
});
$('sound-btn').addEventListener('click', toggleSound);
$('pause-btn').addEventListener('click', function(){
  paused = !paused;
  this.textContent = paused ? '▶' : '⏸';
  if (!paused) lastFrame = performance.now();
});

// Click on canvas = bubble + feed nearby fish
$('canvas-wrap').addEventListener('click', function(e){
  var rect = canvas.getBoundingClientRect();
  var x = (e.clientX - rect.left) / rect.width * W;
  var y = (e.clientY - rect.top) / rect.height * H;
  // Spawn bubble
  scene.bubbles.push({
    x: x,
    y: y,
    vy: -40 - Math.random() * 20,
    size: 3 + Math.random() * 4,
    phase: Math.random() * 6.28,
    alpha: 0.7
  });
  // Drop food
  scene.food.push({ x: x, y: y, life: 6 });
  playBubbleSound();
});

document.addEventListener('keydown', function(e){
  var tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === ' ' || e.code === 'Space'){ e.preventDefault(); $('pause-btn').click(); }
  else if (e.key === 'r' || e.key === 'R'){ e.preventDefault(); $('rand').click(); }
  else if (e.key === 'c' || e.key === 'C'){ e.preventDefault(); $('copy').click(); }
  else if (e.key === 's' || e.key === 'S'){ e.preventDefault(); toggleSound(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); $('prev').click(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); $('next').click(); }
});

// Bubble sound on rise (occasionally)
setInterval(function(){
  if (soundOn && !paused && Math.random() > 0.6) playBubbleSound();
}, 800);

document.addEventListener('visibilitychange', function(){
  if (!document.hidden) lastFrame = performance.now();
});

/* ============================================================
   INIT
   ============================================================ */
var initLoc = randomLoc();
var h = (location.hash || '').replace('#', '');
var ha = new URLSearchParams(h).get('a');
if (ha){
  var n = fromB62(ha);
  if (n !== null) initLoc = n % TOTAL;
}
renderLoc(initLoc);
requestAnimationFrame(frame);

})();
</script>
</body>
