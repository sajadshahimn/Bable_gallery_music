<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finds · Babel Gallery</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ebebea;--surface:#efeeed;--track:#dcdcdb;--fg:#17181a;--muted:#62656c;--accent:#2f6fe0;--accent2:#5b5f68;--btn:#9c9ea6;--btn-fg:#14151a;
--sh-d:rgba(150,150,158,.5);--sh-l:rgba(255,255,255,.95);--grid:rgba(20,24,32,.1);--shade:rgba(20,24,32,.05);--line:rgba(20,24,32,.1);
--raised:8px 8px 18px var(--sh-d),-8px -8px 18px var(--sh-l);--raised-sm:4px 4px 9px var(--sh-d),-4px -4px 9px var(--sh-l);--inset:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--accent2:#aeb2bb;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--grid:rgba(255,255,255,.1);--shade:rgba(255,255,255,.045);--line:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#24262a;--surface:#282a2e;--track:#1e2023;--fg:#ececf0;--muted:#9a9da6;--accent:#5b92f0;--accent2:#aeb2bb;--btn:#5d6068;--btn-fg:#f4f4f7;--sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.055);--grid:rgba(255,255,255,.1);--shade:rgba(255,255,255,.045);--line:rgba(255,255,255,.1)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-weight:700;letter-spacing:-.015em}
a{color:var(--accent)}
.sub,.info,small{color:var(--muted);font-size:13px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
label b{color:var(--accent);font-weight:700}
.neu{background:var(--surface);border-radius:24px;box-shadow:var(--raised)}
.tabs,.seg{display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--surface);box-shadow:var(--inset)}
.tabs button,.seg button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:999px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;transition:box-shadow .15s,color .15s}
.tabs button.on,.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--raised-sm)}
.pill,.tools button,.row button,.bar button{border:0;border-radius:999px;background:var(--surface);color:var(--fg);box-shadow:var(--raised-sm);font:inherit;font-size:14px;cursor:pointer;transition:box-shadow .15s}
.pill,.tools button{padding:8px 16px}
.row button{padding:11px 14px;flex:1}
.pill:hover,.tools button:hover,.row button:hover,.bar button:hover{box-shadow:6px 6px 13px var(--sh-d),-6px -6px 13px var(--sh-l)}
.pill:active,.tools button:active,.row button:active,.bar button:active,.pill.on,.tools button.on{box-shadow:var(--inset);color:var(--accent);font-weight:600}
.bar{position:fixed;left:14px;right:14px;bottom:0;margin:0 auto calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:10px;padding:10px;border-radius:30px}
.bar button{flex:1;padding:12px 4px}
.bar button.go{flex:1.7;background:var(--btn);color:var(--btn-fg);font-weight:600}
.bar button.go:active{color:var(--btn-fg)}
select,input[type=text],textarea{width:100%;padding:11px 16px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--inset);color:var(--fg);font:inherit}
input[type=text],textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
textarea{resize:vertical;word-break:break-all;line-height:1.5}
textarea[aria-invalid="true"]{outline:2px solid #d64545}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;margin:8px 0 4px;border-radius:99px;box-shadow:var(--inset);background:linear-gradient(90deg,var(--accent) var(--pct,50%),var(--track) var(--pct,50%))}
input[type=range]::-webkit-slider-runnable-track{background:transparent;height:10px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-7px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--raised-sm)}
input[type=range]::-moz-range-track{background:transparent;height:10px}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--raised-sm)}
.scroll{overflow-x:auto;border-radius:16px;background:var(--surface);box-shadow:var(--inset);-webkit-overflow-scrolling:touch}
.scroll canvas{display:block;touch-action:manipulation}
.stage canvas{display:block;width:100%;height:auto;border-radius:14px;image-rendering:pixelated;background:#000}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:6px 6px 14px}
.chips .pill{flex:none;white-space:nowrap}
.prm{padding:10px 0;border-top:1px solid var(--line)}
.prm .h{display:flex;justify-content:space-between;font-size:13.5px}
.prm .h b{color:var(--accent);font-weight:600}
.sw{display:flex;gap:10px;overflow-x:auto;padding:6px}
.sw button{flex:none;width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:var(--raised-sm)}
.sw button.on{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.f{margin-bottom:16px}.f:last-child{margin-bottom:0}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
dt{color:var(--muted)}dd{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:6px 2px 2px}.sub{margin:0 2px 16px}
.topnav{display:flex;gap:16px;font-size:13.5px;margin:0 2px 8px}.topnav a{text-decoration:none;font-weight:600}
.card{padding:16px;margin-bottom:16px}.tabs{margin-bottom:16px}
#filters{display:flex;gap:10px;overflow-x:auto;padding:6px 6px 14px}#filters .pill{flex:none}
.find{padding:18px;margin-bottom:18px}.find h3{margin:0 0 2px;font-size:17px;word-break:break-word}
.find .meta{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.find p{margin:0 0 14px;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:10px;flex-wrap:wrap}.pill{text-decoration:none;display:inline-block}
.msg{color:var(--muted);text-align:center;padding:28px 8px}
.free input[type=text],.free textarea{font-family:inherit;font-size:15px}
.free textarea#addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
</style>
</head>
<body>
<main>
<nav class="topnav"><a href="index.html">← Home</a><a href="music.html">Music</a><a href="image.html">Images</a></nav>
<h1>Finds</h1>
<p class="sub">Tunes and pictures that people found in the gallery. Every find is reviewed before it appears here.</p>

<nav class="tabs neu"><button data-t="browse" class="on">Browse</button><button data-t="share">Share a find</button></nav>

<section id="p-browse">
<div id="filters"><button class="pill on" data-f="all">All</button><button class="pill" data-f="music">Music</button><button class="pill" data-f="image">Images</button></div>
<div id="list"><p class="msg">Loading finds…</p></div>
</section>

<section id="p-share" class="neu card free" hidden>
<div class="f"><label for="title">Title</label><input type="text" id="title" maxlength="100" placeholder="A short name for your find"></div>
<div class="f"><label for="type">Type</label><select id="type"><option value="music">Music</option><option value="image">Image</option></select></div>
<div class="f"><label for="addr">Address (copy it from the Address tab)</label><textarea id="addr" rows="3" spellcheck="false" placeholder="Digits and letters"></textarea></div>
<div id="imgOpts" hidden>
<div class="f"><label for="mode">Colors</label><select id="mode"><option value="mono">Mono</option><option value="gray">Gray (4 levels)</option><option value="color">16 colors</option></select></div>
<div class="f"><label for="size">Cell size</label><select id="size"><option value="120">120 px (16 × 9)</option><option value="60" selected>60 px (32 × 18)</option><option value="40">40 px (48 × 27)</option><option value="30">30 px (64 × 36)</option><option value="24">24 px (80 × 45)</option></select></div>
</div>
<div class="f"><label for="note">Note (optional)</label><textarea id="note" rows="3" maxlength="300" placeholder="Why is it interesting?"></textarea></div>
<p class="info" id="shareMsg">This opens GitHub in a new tab, where you submit your find as an issue. You need a free GitHub account. It appears here after it is approved.</p>
<div class="row"><button id="send">Open on GitHub</button></div>
</section>
</main>

<script>
(function(){
"use strict";
var REPO='sajadshahimn/Bable_gallery_music';
var PX=[120,60,40,30,24],MODES=['mono','gray','color'];
var $=function(i){return document.getElementById(i)};
var all=[],filter='all';

function parse(it){
 var b=String(it.body||''),t=(b.match(/^type:\s*(music|image)\s*$/im)||[])[1],a=(b.match(/^address:\s*([0-9A-Za-z]+)\s*$/m)||[])[1];
 if(!t||!a||a.length>3000)return null;
 t=t.toLowerCase();
 var f={type:t,addr:a,title:String(it.title||'').slice(0,120),by:(it.user&&it.user.login)||'',url:it.html_url,date:it.created_at,comments:it.comments|0};
 if(t==='image'){
  var m=(b.match(/^mode:\s*(\w+)\s*$/im)||[])[1],s=parseInt((b.match(/^size:\s*(\d+)\s*$/im)||[])[1],10);
  f.mode=MODES.indexOf(m)>=0?m:'color';f.size=PX.indexOf(s)>=0?s:60}
 var n=b.match(/^note:\s*([\s\S]*)$/im);
 f.note=n?n[1].trim().slice(0,300):'';
 return f}
function href(f){return f.type==='music'?'music.html#a='+f.addr:'image.html#a='+f.addr+'&m='+f.mode+'&s='+f.size}

function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function render(){
 var box=$('list'),items=all.filter(function(f){return filter==='all'||f.type===filter});
 box.innerHTML='';
 if(!items.length){box.appendChild(el('p','msg','No finds here yet. Be the first to share one.'));return}
 items.forEach(function(f){
  var c=el('article','find neu'),d=new Date(f.date),acts=el('div','acts'),a1=el('a','pill','Open'),a2=el('a','pill','Discuss ('+f.comments+')');
  c.appendChild(el('h3','',f.title||'Untitled'));
  c.appendChild(el('div','meta',(f.type==='music'?'Music':'Image')+(f.by?' · by @'+f.by:'')+(isNaN(d)?'':' · '+d.toLocaleDateString())));
  if(f.note)c.appendChild(el('p','',f.note));
  a1.href=href(f);
  a2.href=f.url;a2.target='_blank';a2.rel='noopener noreferrer';
  acts.appendChild(a1);acts.appendChild(a2);c.appendChild(acts);box.appendChild(c)})}
function load(){
 fetch('https://api.github.com/repos/'+REPO+'/issues?labels=approved&state=open&per_page=50',{headers:{Accept:'application/vnd.github+json'}})
 .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
 .then(function(list){all=list.filter(function(i){return !i.pull_request}).map(parse).filter(Boolean);render()})
 .catch(function(){var b=$('list');b.innerHTML='';
  var p=el('p','msg','Could not load finds right now. GitHub may be rate-limiting this connection; try again in a few minutes.');b.appendChild(p)})}

document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){showTab(b.dataset.t)})});
function showTab(t){
 document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x.dataset.t===t)});
 $('p-browse').hidden=(t!=='browse');$('p-share').hidden=(t!=='share')}
$('filters').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
 filter=b.dataset.f;document.querySelectorAll('#filters .pill').forEach(function(x){x.classList.toggle('on',x===b)});render()});
$('type').addEventListener('change',function(){$('imgOpts').hidden=(this.value!=='image')});
$('send').addEventListener('click',function(){
 var title=$('title').value.trim(),type=$('type').value,addr=$('addr').value.replace(/\s/g,''),note=$('note').value.trim(),msg=$('shareMsg');
 if(!title){msg.textContent='Please add a title.';return}
 if(!/^[0-9A-Za-z]+$/.test(addr)||addr.length>3000){msg.textContent='The address should contain only digits and letters.';return}
 var body='type: '+type+'\naddress: '+addr+'\n'+(type==='image'?'mode: '+$('mode').value+'\nsize: '+$('size').value+'\n':'')+'\nNote: '+note;
 var url='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
 window.open(url,'_blank','noopener')});

/* prefill from the Music and Image pages */
var q=new URLSearchParams(location.search);
if(q.get('share')){
 showTab('share');
 var t=q.get('type');if(t==='music'||t==='image'){$('type').value=t;$('imgOpts').hidden=(t!=='image')}
 var a=q.get('a');if(a&&/^[0-9A-Za-z]+$/.test(a))$('addr').value=a;
 var m=q.get('m');if(MODES.indexOf(m)>=0)$('mode').value=m;
 var s=q.get('s');if(PX.indexOf(parseInt(s,10))>=0)$('size').value=s}
load();
})();
</script>
</body>
</html>
