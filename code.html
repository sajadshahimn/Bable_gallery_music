puts "${c.msg} #{binary_search(arr, arr[0])}"`;},
fib:function(c){var n=(c.nums[0]%15)+1;return `def fib(n)
  a, b = 0, 1
  n.times { a, b = b, a + b }
  a
end
puts "${c.msg} #{fib(${n})}"`;},
fact:function(c){var n=(c.nums[0]%10)+1;return `def fact(n)
  (1..n).reduce(1, :*)
end
puts "${c.msg} #{fact(${n})}"`;},
fizz:function(c){var n=(c.nums[0]%20)+5;return `(1..${n}).each do |i|
  if i % 15 == 0 then puts "FizzBuzz"
  elsif i % 3 == 0 then puts "Fizz"
  elsif i % 5 == 0 then puts "Buzz"
  else puts i
  end
end`;},
prime:function(c){var n=c.nums[0];return `def prime?(n)
  return false if n < 2
  (2..Math.sqrt(n).to_i).none? { |i| n % i == 0 }
end
puts "${c.msg} #{prime?(${n})}"`;},
rev:function(c){return `s = "${c.word}"
puts "${c.msg} #{s.reverse}"`;},
pal:function(c){return `s = "${c.word}"
puts "${c.msg} #{s == s.reverse}"`;},
gcd:function(c){return `def gcd(a, b)
  a, b = b, a % b while b > 0
  a
end
puts "${c.msg} #{gcd(${c.nums[0]}, ${c.nums[1]})}"`;},
fibr:function(c){var n=(c.nums[0]%12)+1;return `def fib(n)
  n <= 1 ? n : fib(n-1) + fib(n-2)
end
puts "${c.msg} #{fib(${n})}"`;},
stats:function(c){return `arr = ${c.arr}
puts "Sum: #{arr.sum}"
puts "Max: #{arr.max}"`;},
vowels:function(c){return `s = "${c.word}"
puts "${c.msg} #{s.count('aeiou')}"`;},
leap:function(c){var y=1900+c.nums[0]*20;return `y = ${y}
leap = (y % 4 == 0 && y % 100 != 0) || y % 400 == 0
puts "${c.msg} #{leap}"`;},
temp:function(c){return `c = ${c.nums[0]}
f = c * 9.0 / 5.0 + 32
puts "#{c}°C = #{f}°F"`;},
caesar:function(c){return `def caesar(s, shift)
  s.chars.map do |ch|
    if ch =~ /[a-z]/
      (((ch.ord - 97 + shift) % 26) + 97).chr
    else
      ch
    end
  end.join
end
puts "${c.msg} #{caesar("${c.word}", ${c.nums[1]%10+1})}"`;},
ls:function(c){return `def linear_search(arr, t)
  arr.index(t) || -1
end
puts "${c.msg} #{linear_search(${c.arr}, ${c.nums[1]})}"`;}
}
};

/* ---------- Helpers ---------- */
function toB62(n){
  if(n===0n) return '0';
  var out=[];
  while(n>0n){ out.push(B62[Number(n%62n)]); n=n/62n; }
  return out.reverse().join('');
}
function fromB62(s){
  var n=0n;
  for(var i=0;i<s.length;i++){
    var k=B62.indexOf(s[i]);
    if(k<0) return null;
    n=n*62n+BigInt(k);
  }
  return n;
}
function decode(loc){
  var r=loc%M, parts=[];
  for(var i=0;i<RADIX.length;i++){
    parts.push(Number(r%BigInt(RADIX[i])));
    r=r/BigInt(RADIX[i]);
  }
  return {
    lang:parts[0], concept:parts[1], style:parts[2],
    varnames:parts[3], numbers:parts[4], message:parts[5]
  };
}
function encode(s){
  var x=0n, p=1n;
  var parts=[s.lang,s.concept,s.style,s.varnames,s.numbers,s.message];
  for(var i=0;i<parts.length;i++){
    x+=BigInt(parts[i])*p;
    p*=BigInt(RADIX[i]);
  }
  return x%M;
}

/* ---------- Render ---------- */
var $=function(id){return document.getElementById(id)};
var currentLoc=0n, currentCode='', currentLangId='py';

function render(loc){
  currentLoc=loc;
  var s=decode(loc);
  var lang=LANGS[s.lang];
  var concept=CONCEPTS[s.concept];
  var style=STYLES[s.style];
  var ctx=makeContext(s.numbers, s.message);
  var code=TPL[lang.id][concept.id](ctx);

  currentCode=code;
  currentLangId=lang.id;

  $('m-lang').textContent=lang.name;
  $('m-concept').textContent=concept.name;
  $('m-style').textContent=style;
  $('m-complexity').textContent=concept.complexity+'/5';

  var codeEl=$('code-display');
  codeEl.className='language-'+lang.hljs;
  codeEl.textContent=code;
  try{ hljs.highlightElement(codeEl); }catch(e){}

  $('addr').value=toB62(loc);
  try{ history.replaceState(null,'','#a='+toB62(loc)); }catch(e){}
  $('output').className='output';
  $('output').textContent='';
}

/* ---------- Number helpers ---------- */
function randomLoc(){
  var buf=new Uint8Array(8);
  try{ crypto.getRandomValues(buf); }catch(e){ for(var i=0;i<8;i++) buf[i]=Math.floor(Math.random()*256); }
  var x=0n;
  for(var j=0;j<8;j++) x=(x<<8n)|BigInt(buf[j]);
  return x%M;
}

/* ---------- Run via Piston ---------- */
var runtimesCache=null;
async function getRuntime(pistonName){
  if(!runtimesCache){
    var r=await fetch('https://emkc.org/api/v2/piston/runtimes');
    if(!r.ok) throw new Error('Failed to fetch runtimes');
    runtimesCache=await r.json();
  }
  var matches=runtimesCache.filter(function(x){ return x.language===pistonName; });
  if(!matches.length) throw new Error('Runtime not available: '+pistonName);
  matches.sort(function(a,b){
    var av=a.version.split('.').map(Number), bv=b.version.split('.').map(Number);
    return (bv[0]-av[0])||(bv[1]-av[1])||(bv[2]-av[2]);
  });
  return matches[0];
}

async function runCode(){
  var runBtn=$('run'), output=$('output');
  runBtn.disabled=true;
  runBtn.textContent='⏳ Running…';
  output.className='output show';
  output.innerHTML='<div class="label">Running</div>Compiling and executing…';

  try{
    var lang=LANGS.find(function(l){ return l.id===currentLangId; });
    var runtime=await getRuntime(lang.piston);
    var resp=await fetch('https://emkc.org/api/v2/piston/execute',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        language:runtime.language,
        version:runtime.version,
        files:[{content:currentCode}],
        stdin:''
      })
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    var data=await resp.json();

    var html='';
    var compErr=data.compile&&data.compile.stderr;
    var runOut=data.run&&data.run.stdout;
    var runErr=data.run&&data.run.stderr;

    if(compErr){
      html+='<div class="label">Compile error</div><div class="stderr">'+escapeHtml(compErr)+'</div>';
    } else {
      html+='<div class="label">Output</div>';
      if(runOut) html+='<div class="success">'+escapeHtml(runOut)+'</div>';
      if(runErr) html+='<div class="stderr">'+escapeHtml(runErr)+'</div>';
      if(!runOut&&!runErr) html+='<div>(no output)</div>';
    }
    output.innerHTML=html;
  }catch(e){
    output.innerHTML='<div class="label">Error</div><div class="stderr">'+escapeHtml(e.message)+'</div>';
  }
  runBtn.disabled=false;
  runBtn.textContent='▶ Run';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------- Event listeners ---------- */
$('go').addEventListener('click',function(){
  var n=fromB62($('addr').value.trim());
  if(n!==null) render(n);
});
$('addr').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); $('go').click(); }
});
$('prev').addEventListener('click',function(){ render(((currentLoc-1n)%M+M)%M); });
$('next').addEventListener('click',function(){ render((currentLoc+1n)%M); });
$('rand').addEventListener('click',function(){ render(randomLoc()); });
$('copy').addEventListener('click',function(){
  var b=this;
  navigator.clipboard.writeText(toB62(currentLoc)).then(function(){
    var t=b.textContent; b.textContent='Copied ✓';
    setTimeout(function(){ b.textContent=t; },1200);
  });
});
$('copy-code').addEventListener('click',function(){
  var b=this;
  navigator.clipboard.writeText(currentCode).then(function(){
    var t=b.textContent; b.textContent='✓ Copied';
    setTimeout(function(){ b.textContent=t; },1200);
  });
});
$('download').addEventListener('click',function(){
  var lang=LANGS.find(function(l){ return l.id===currentLangId; });
  var blob=new Blob([currentCode],{type:'text/plain'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='babel-'+toB62(currentLoc)+'.'+lang.ext;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
});
$('open-in-github').addEventListener('click',function(){
  var url='https://github.com/sajadshahimn/Bable_gallery_music/issues/new?title='+encodeURIComponent('Babel Code find')+'&body='+encodeURIComponent('Address: '+toB62(currentLoc)+'\n\nCode:\n```\n'+currentCode+'\n```\n');
  window.open(url,'_blank','noopener');
});
$('run').addEventListener('click',runCode);

document.addEventListener('keydown',function(e){
  var t=e.target&&e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA') return;
  if(e.key==='r'||e.key==='R'){ e.preventDefault(); $('rand').click(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); $('prev').click(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); $('next').click(); }
  else if(e.key==='c'||e.key==='C'){ e.preventDefault(); $('copy').click(); }
  else if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); $('run').click(); }
});

/* ---------- Init ---------- */
var initLoc=randomLoc();
var h=(location.hash||'').replace('#','');
var ha=new URLSearchParams(h).get('a');
if(ha){ var n=fromB62(ha); if(n!==null) initLoc=n; }
render(initLoc);
})();
</script>
